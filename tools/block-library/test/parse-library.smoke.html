<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Block Library parser smoke test</title>
    <meta charset="utf-8"/>
    <style>
      body { font-family: monospace; padding: 16px; }
      .pass { color: #078d55; }
      .fail { color: #d31510; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>parseCatalogSheet() / findBlockInstance() smoke test</h1>
    <div id="out"></div>
    <script type="module">
      import { parseCatalogSheet, findBlockInstance } from '/tools/block-library/parse-library.js';
      import {
        sourceUrl, sheetUrl, editUrl, editUrlForRow, resolveLinkedPage,
      } from '/tools/block-library/da-context.js';

      const out = document.querySelector('#out');
      let failed = 0;
      const assert = (name, cond) => {
        const el = document.createElement('div');
        el.className = cond ? 'pass' : 'fail';
        el.textContent = `${cond ? 'PASS' : 'FAIL'} — ${name}`;
        out.append(el);
        if (!cond) failed += 1;
      };

      // --- parseCatalogSheet ---

      assert('empty sheet yields no blocks', parseCatalogSheet({ data: [] }).length === 0);
      assert('missing data array yields no blocks', parseCatalogSheet({}).length === 0);

      const rowsMissingFields = parseCatalogSheet({
        data: [
          { name: 'hero', path: '' },
          { name: '', path: '/docs/library/examples/x' },
          { name: 'hero', path: '/docs/library/examples/hero-basic' },
        ],
      });
      assert('rows missing name or path are dropped', rowsMissingFields.length === 1);
      assert('surviving row keeps its name', rowsMissingFields[0]?.name === 'hero');

      const grouped = parseCatalogSheet({
        data: [
          { name: 'cards', path: '/docs/library/examples/cards-bordered', label: 'Bordered' },
          { name: 'cards', path: '/docs/library/examples/cards-event' },
          { name: 'accordion', path: '/docs/library/examples/accordion-basic' },
        ],
      });
      assert('two distinct block names', grouped.length === 2);
      assert('catalog sorted alphabetically', grouped.map((b) => b.name).join(',') === 'accordion,cards');
      assert('cards has two rows (variations)', grouped.find((b) => b.name === 'cards').rows.length === 2);
      assert('row label read from sheet', grouped.find((b) => b.name === 'cards').rows[0].label === 'Bordered');
      assert('row without label column is null', grouped.find((b) => b.name === 'cards').rows[1].label === null);
      assert(
        'description column used as label fallback',
        parseCatalogSheet({ data: [{ name: 'hero', path: '/x', description: 'Basic hero' }] })[0].rows[0].label === 'Basic hero',
      );

      // --- findBlockInstance ---

      const noMatch = findBlockInstance('<body><main><div><div class="hero"><div><div><p>hi</p></div></div></div></div></main></body>', 'cards');
      assert('no matching block returns null', noMatch === null);

      const heroPage = `<body><main><div>
        <h2>Basic hero</h2>
        <div class="hero"><div><div><h1>Welcome</h1></div></div></div>
      </div></main></body>`;
      const hero = findBlockInstance(heroPage, 'hero');
      assert('matching block found', hero !== null);
      assert('found block has correct name', hero.name === 'hero');
      assert('found block has no variants', hero.variants.length === 0);
      assert('found block picks up nearest heading as label', hero.label === 'Basic hero');
      assert('found block html is the outerHTML of the instance', hero.html.includes('Welcome'));

      const variantPage = `<body><main><div>
        <div class="cards bordered dark"><div><div><p>a</p></div></div></div>
      </div></main></body>`;
      const variant = findBlockInstance(variantPage, 'cards');
      assert('variant classes captured in order', variant.variants.join(',') === 'bordered,dark');

      const configPage = `<body><main><div>
        <div class="cta">
          <div><div>text</div><div>Learn more</div></div>
          <div><div>href</div><div>/learn-more</div></div>
        </div>
      </div></main></body>`;
      const cta = findBlockInstance(configPage, 'cta');
      assert('block config text read', cta.config.text === 'Learn more');
      assert('block config href read', cta.config.href === '/learn-more');

      // Only the first matching instance on a page is returned.
      const twoInstances = findBlockInstance(`<body><main>
        <div><div class="quote"><div><div><p>first</p></div></div></div></div>
        <div><div class="quote"><div><div><p>second</p></div></div></div></div>
      </main></body>`, 'quote');
      assert('first matching instance wins when a page has more than one', twoInstances.html.includes('first'));

      // --- da-context.js ---

      assert(
        'sourceUrl builds admin.da.live URL for a fixed catalog path',
        sourceUrl({ org: 'thomsebastin', site: 'da-test' }, '/docs/library/blocks', 'json')
          === 'https://admin.da.live/source/thomsebastin/da-test/docs/library/blocks.json',
      );
      assert(
        'sourceUrl falls back to context.repo when site is absent',
        sourceUrl({ org: 'thomsebastin', repo: 'da-test' }, '/docs/library/blocks')
          === 'https://admin.da.live/source/thomsebastin/da-test/docs/library/blocks.html',
      );
      assert(
        'sheetUrl builds a da.live sheet-editor URL',
        sheetUrl({ org: 'thomsebastin', site: 'da-test' }, '/docs/library/blocks')
          === 'https://da.live/sheet#/thomsebastin/da-test/docs/library/blocks',
      );
      assert(
        'editUrl builds a da.live document-editor URL',
        editUrl({ org: 'thomsebastin', site: 'da-test' }, '/docs/library/examples/hero-basic')
          === 'https://da.live/edit#/thomsebastin/da-test/docs/library/examples/hero-basic',
      );
      assert(
        'resolveLinkedPage rewrites a content.da.live link to an authenticated admin.da.live URL',
        resolveLinkedPage({ org: 'thomsebastin', site: 'da-test' }, 'https://content.da.live/thomsebastin/da-test/docs/library/blocks/accordion')
          === 'https://admin.da.live/source/thomsebastin/da-test/docs/library/blocks/accordion.html',
      );
      assert(
        'resolveLinkedPage uses the content.da.live URL\'s own org/site, not the current context',
        resolveLinkedPage({ org: 'other-org', site: 'other-site' }, 'https://content.da.live/thomsebastin/da-test/docs/library/blocks/accordion')
          === 'https://admin.da.live/source/thomsebastin/da-test/docs/library/blocks/accordion.html',
      );
      assert(
        'resolveLinkedPage resolves a bare DA path against the current context',
        resolveLinkedPage({ org: 'thomsebastin', site: 'da-test' }, '/docs/library/examples/hero-basic')
          === 'https://admin.da.live/source/thomsebastin/da-test/docs/library/examples/hero-basic.html',
      );
      assert(
        'editUrlForRow builds an edit URL from a content.da.live link\'s own org/site',
        editUrlForRow({ org: 'thomsebastin', site: 'da-test' }, 'https://content.da.live/thomsebastin/da-test/docs/library/blocks/accordion')
          === 'https://da.live/edit#/thomsebastin/da-test/docs/library/blocks/accordion',
      );
      assert(
        'editUrlForRow builds an edit URL for a bare DA path',
        editUrlForRow({ org: 'thomsebastin', site: 'da-test' }, '/docs/library/examples/hero-basic')
          === 'https://da.live/edit#/thomsebastin/da-test/docs/library/examples/hero-basic',
      );
      try {
        sourceUrl({ org: 'thomsebastin' }, '/docs/library/blocks');
        assert('sourceUrl throws when site/repo is missing', false);
      } catch (err) {
        assert('sourceUrl throws when site/repo is missing', /org\/site/.test(err.message));
      }

      const summary = document.createElement('h2');
      summary.className = failed ? 'fail' : 'pass';
      summary.textContent = failed ? `${failed} test(s) FAILED` : 'ALL TESTS PASSED';
      out.prepend(summary);
      window.__smokeFailed = failed;
    </script>
  </body>
</html>
