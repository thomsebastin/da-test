<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Preflight</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="data:,">
    <!-- Import DA App SDK -->
    <script src="https://da.live/nx/utils/sdk.js" type="module"></script>
    <!-- Preflight panel (uses the shared validator via preflight.js) -->
    <script src="/tools/validation/preflight-panel.js" type="module"></script>
    <!-- Adobe Clean -->
    <link rel="stylesheet" href="https://use.typekit.net/hah7vzn.css">
    <style>
      :root {
        --error: #d31510;
        --warning: #bb6800;
        --info: #4b4b4b;
        --ok: #078d55;
        --border: #e1e1e1;
        --bg-subtle: #f5f5f5;
      }
      body {
        font-family: 'Adobe Clean', 'adobe-clean', sans-serif;
        margin: 0;
        padding: 16px;
        color: #222;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      h1 { font-size: 15px; margin: 0; }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #555;
        margin: 16px 0 6px;
      }
      #refresh {
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 4px 12px;
        background: #fff;
      }
      #refresh:hover { background: var(--bg-subtle); }
      .gate {
        font-size: 14px;
        font-weight: 700;
        text-align: center;
        padding: 12px;
        border-radius: 6px;
        color: #fff;
      }
      .gate--pass { background: var(--ok); }
      .gate--fail { background: var(--error); }
      .issues { list-style: none; margin: 0; padding: 0; }
      .issue {
        display: grid;
        grid-template-columns: 18px 1fr;
        gap: 4px 8px;
        align-items: start;
        font-size: 13px;
        line-height: 1.4;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
      }
      .issue .icon { font-weight: 700; }
      .issue--error .icon { color: var(--error); }
      .issue--warning .icon { color: var(--warning); }
      .issue--info .icon { color: var(--info); }
      .issue--ok { color: var(--ok); }
      .message { grid-column: 2; }
      .location {
        grid-column: 2;
        font-size: 11px;
        color: #767676;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Preflight</h1>
      <button id="refresh" type="button">Re-run</button>
    </header>
    <div id="panel"></div>
  </body>
</html>
